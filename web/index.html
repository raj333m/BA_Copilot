<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BA Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/vfs_fonts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<style>
/* Layout idea: an enterprise workbench. Night-navy app bar with a loop-blue accent rule and a 4-step
   progress rail; a live dashboard strip summarises the document; left section rail, right working pane. */
:root {
  --navy: #0b1b33;          /* app bar, document titles */
  --accent: #0b5cad;        /* primary actions, links, headings */
  --accent-pale: #9cc3e6;   /* soft fills, focus halos */
  --grey: #8a939e;          /* secondary text */
  --paper: #f3f6fa;         /* page */
  --panel: #ffffff;         /* cards */
  --ink: #0b1b33;
  --muted: #5d6877;
  --line: #dbe2ea;
  --soft: #e8f1fa;
  --accent-ink: #ffffff;
  --ok: #157347; --ok-soft: #e2f3ea;
  --warn: #9a5b00; --warn-soft: #fdf1dc;
  --bad: #b42318; --bad-soft: #fdecea;
  --code: #eef2f7;
  --shadow: 0 1px 2px rgba(11, 27, 51, .06), 0 4px 16px rgba(11, 27, 51, .05);
  --font-display: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #08111f; --panel: #0f1d33; --ink: #e7eef7; --muted: #9eabbd; --line: #22344f; --soft: #132a48;
    --accent: #5fa0e6; --accent-ink: #06101e; --accent-pale: #2a5d93; --grey: #8a939e;
    --ok: #5fcf8f; --ok-soft: #12301f; --warn: #f0b45a; --warn-soft: #33270f; --bad: #f28b82; --bad-soft: #3a1714;
    --code: #132540; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #08111f; --panel: #0f1d33; --ink: #e7eef7; --muted: #9eabbd; --line: #22344f; --soft: #132a48;
  --accent: #5fa0e6; --accent-ink: #06101e; --accent-pale: #2a5d93; --grey: #8a939e;
  --ok: #5fcf8f; --ok-soft: #12301f; --warn: #f0b45a; --warn-soft: #33270f; --bad: #f28b82; --bad-soft: #3a1714;
  --code: #132540; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--font-display); }
h1 { font-weight: 700; font-size: 27px; line-height: 1.2; letter-spacing: -.01em; }
h2 { font-weight: 700; font-size: 18px; line-height: 1.3; }
h3 { font-weight: 600; font-size: 15px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- app bar */
.top { position: sticky; top: 0; z-index: 10; background: #0b1b33; color: #e7eef7; }
.top::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, #0b5cad 0 70%, #9cc3e6 70% 100%); }
.topin { max-width: 1360px; margin: 0 auto; display: flex; align-items: center; gap: 22px; padding: 10px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand b { font: 700 18px var(--font-display); letter-spacing: .01em; }
.brand span { color: #9fb1c8; font-size: 12.5px; }
.rail { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.rail button { border: none; background: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: #9fb1c8;
  display: flex; gap: 8px; align-items: center; font-size: 14px; }
.rail button:hover { color: #fff; background: rgba(255,255,255,.06); }
.rail .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
  border: 1.5px solid #3b5375; font-variant-numeric: tabular-nums; }
.rail button[aria-current="true"] { color: #fff; background: rgba(95,160,230,.16); }
.rail button[aria-current="true"] .n { background: #0b5cad; border-color: #5fa0e6; color: #fff; }
.rail button.done .n { background: #157347; border-color: #5fcf8f; color: #fff; }
.rail .sep { width: 18px; height: 1.5px; background: #3b5375; }
.top .spacer { flex: 1; }
.top .meta { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: #9fb1c8; }
.iconbtn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid #2c4466; background: none; color: #e7eef7; cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { background: rgba(255,255,255,.08); }
.btn.on-dark { background: none; color: #e7eef7; border-color: #2c4466; }

/* ---------- layout */
main { max-width: 1360px; margin: 0 auto; padding: 24px; display: grid; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.lede { color: var(--muted); max-width: 75ch; margin: 4px 0 0; }
.eyebrow { font: 600 12px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.grid3 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
@media (max-width: 860px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 600; align-content: start; }
label.f small { font-weight: 400; color: var(--muted); }
input[type=text], select, textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; transition: border-color .15s, box-shadow .15s; }
input[type=text]:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea { resize: vertical; font: 13.5px/1.6 var(--font-mono); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
.hint { font-size: 12.5px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 14px; cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; white-space: nowrap; transition: border-color .15s, background .15s, transform .05s; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.lg { padding: 11px 20px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 11.5px var(--font-mono); background: var(--panel); color: var(--ink); }

/* ---------- how it works */
.how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; box-shadow: var(--shadow); }
.how div { padding: 14px 16px; display: grid; gap: 2px; border-left: 1px solid var(--line); }
.how div:first-child { border-left: none; }
.how b { font: 700 14px var(--font-display); }
.how span { font-size: 12.5px; color: var(--muted); }
.how i { font-style: normal; font: 700 12px var(--font-mono); color: var(--accent); }
@media (max-width: 760px) { .how { grid-template-columns: 1fr 1fr; } .how div:nth-child(3) { border-left: none; } }

.drop { border: 1.5px dashed var(--accent-pale); border-radius: 10px; padding: 22px 16px; display: grid; gap: 6px; text-align: center; justify-items: center;
  color: var(--muted); cursor: pointer; background: var(--soft); transition: background .15s, border-color .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.drop b { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
.chip button { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0; }
.dict { display: grid; gap: 8px; align-content: start; }
.dict .btn.rec { background: var(--bad); color: #fff; border-color: var(--bad); }

.notice { border-radius: 8px; padding: 10px 14px; font-size: 14px; border: 1px solid transparent; }
.notice.info { background: var(--soft); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }

.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.none { background: var(--code); color: var(--muted); }
.pill.draft { background: var(--warn-soft); color: var(--warn); }
.pill.saved { background: var(--soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.gap { background: var(--bad-soft); color: var(--bad); }

/* ---------- dashboard */
.dash { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; }
@media (max-width: 960px) { .dash { grid-template-columns: 1fr; } }
.ring { display: flex; gap: 14px; align-items: center; }
.ring svg { flex: none; }
.ring b { font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; }
.ring span { display: block; font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(6, minmax(78px, 1fr)); gap: 8px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(3, 1fr); } }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 0; background: var(--paper); }
.stat b { font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.stat.warn b { color: var(--warn); }
.cover { min-width: 220px; display: grid; gap: 6px; font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--code); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }

/* ---------- section workspace */
.ws { display: grid; grid-template-columns: 280px 1fr; gap: 18px; align-items: start; }
@media (max-width: 960px) { .ws { grid-template-columns: 1fr; } }
.seclist { display: grid; gap: 4px; position: sticky; top: 84px; }
.seclist button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  padding: 9px 12px 9px 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; position: relative; overflow: hidden; transition: border-color .15s; }
.seclist button:hover { border-color: var(--accent-pale); }
.seclist button::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.seclist button[data-s="draft"]::before { background: var(--warn); }
.seclist button[data-s="saved"]::before { background: var(--accent); }
.seclist button[data-s="ok"]::before { background: var(--ok); }
.seclist button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.seclist .t { font-weight: 600; font-size: 13.5px; }
.seclist .s { font-size: 12px; color: var(--muted); grid-column: 1; }
.seclist .k { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 12px var(--font-mono); color: var(--grey); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--paper); }
.seg button { border: none; background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: none; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.pane { display: grid; gap: 14px; }
.pane.split { grid-template-columns: 1fr 1fr; }
@media (max-width: 1100px) { .pane.split { grid-template-columns: 1fr; } }
#editor { min-height: 540px; }
.mdbox { border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px; max-height: 640px; overflow: auto; background: var(--panel); }
.statusbar { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.md { max-width: 100%; overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; margin: 8px 0 14px; width: 100%; }
.md th { background: var(--navy); color: #fff; text-align: left; }
:root[data-theme="dark"] .md th { background: #1d3a63; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; vertical-align: top; }
.md tr:nth-child(even) td { background: var(--paper); }
.md pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font: 12.5px/1.5 var(--font-mono); }
.md code { font-family: var(--font-mono); font-size: .92em; }
.md h2 { margin: 18px 0 6px; font-size: 16.5px; color: var(--accent); }
.md h3 { margin: 14px 0 4px; }
.md p, .md ul, .md ol { margin: 4px 0 8px; }
.diff { font: 12.5px/1.55 var(--font-mono); border: 1px solid var(--line); border-radius: 6px; max-height: 640px; overflow: auto; }
.diff div { padding: 0 10px; white-space: pre-wrap; }
.diff .add { background: var(--ok-soft); color: var(--ok); }
.diff .del { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.diff .same { color: var(--muted); }
.improve { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; background: var(--paper); }
.improve .chipbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.improve .chipbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.improve .chipbtn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- diagrams */
.dgrid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; }
@media (max-width: 960px) { .dgrid { grid-template-columns: 1fr; } }
.dprev { border: 1px solid var(--line); border-radius: 8px; background: #fff; min-height: 300px; max-height: 520px; overflow: auto; padding: 10px; color: #111; }
.dprev svg { max-width: 100%; height: auto; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; display: flex; gap: 6px; align-items: center; cursor: pointer; font-size: 13.5px; background: var(--panel); }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--soft); color: var(--accent); font-weight: 600; }

/* ---------- export + traceability */
table.status { border-collapse: collapse; width: 100%; font-size: 14px; }
table.status th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12.5px; border-bottom: 1px solid var(--line); padding: 6px 8px; }
table.status td { border-bottom: 1px solid var(--line); padding: 7px 8px; font-variant-numeric: tabular-nums; }
.trace { display: grid; gap: 6px; }
.trow { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.trow > button { width: 100%; border: none; background: none; cursor: pointer; display: grid; grid-template-columns: 76px 1fr auto auto; gap: 12px; align-items: center; padding: 9px 12px; text-align: left; }
.trow > button b { font: 600 13px var(--font-mono); color: var(--accent); }
.trow .links { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.trow .links span { font: 11.5px var(--font-mono); background: var(--code); border-radius: 4px; padding: 1px 6px; }
.trow .detail { padding: 4px 14px 12px 100px; display: grid; gap: 6px; font-size: 13.5px; }
.trow .detail div { display: grid; grid-template-columns: 70px 1fr; gap: 10px; }
.trow .detail code { font: 12px var(--font-mono); color: var(--accent); }
.filter { display: inline-flex; gap: 4px; }
.docprev { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 32px 40px; box-shadow: var(--shadow); }
.docprev h1.sec { font: 700 21px var(--font-display); color: var(--accent); margin: 26px 0 8px; padding-top: 18px; border-top: 1px solid var(--line); }
.docprev h1.sec:first-child { border: none; padding-top: 0; margin-top: 0; }
figure { margin: 12px 0; text-align: center; }
figure figcaption { font-size: 12.5px; color: var(--muted); font-style: italic; }

/* ---------- overlays */
.overlay { position: fixed; inset: 0; background: rgba(8, 17, 31, .6); display: grid; place-items: center; z-index: 20; padding: 16px; }
.overlay .box { background: var(--panel); border-radius: 12px; width: min(720px, 100%); padding: 22px; display: grid; gap: 14px; max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.progress { height: 6px; background: var(--code); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.steps { display: grid; gap: 4px; font-size: 14px; }
.steps div { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.steps div.cur { color: var(--ink); font-weight: 600; }
.steps div.done { color: var(--ok); }
.live { background: var(--code); border-radius: 6px; padding: 10px; font: 12px/1.45 var(--font-mono); height: 180px; overflow: auto; white-space: pre-wrap; }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 30; max-width: 420px; display: grid; gap: 8px; }
.toast .notice { box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; animation: rise .2s ease-out; }
.toast .notice button { margin-left: auto; border: none; background: none; font-weight: 700; color: inherit; cursor: pointer; text-decoration: underline; }
@keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
.hidden { display: none !important; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="2" width="20" height="26" rx="3" fill="#0b5cad"/><rect x="7" y="8" width="12" height="2" rx="1" fill="#fff"/><rect x="7" y="13" width="12" height="2" rx="1" fill="#9cc3e6"/><rect x="7" y="18" width="8" height="2" rx="1" fill="#9cc3e6"/><circle cx="23" cy="23" r="6" fill="#0b1b33" stroke="#9cc3e6" stroke-width="2"/><path d="M20.5 23l1.8 1.8 3.4-3.6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    <div><b>BA Copilot</b><br><span>Requirements &amp; HLD workbench</span></div></div>
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <div class="spacer"></div>
  <div class="meta"><span id="saveState">Not saved yet</span>
    <button class="iconbtn" type="button" id="kbdBtn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">⌨</button>
    <button class="iconbtn" type="button" id="themeBtn" aria-label="Switch light or dark theme" title="Switch theme">◐</button>
    <button class="btn on-dark" id="projBtn" type="button">Projects</button></div>
</div></header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ====================================================================== content */
const SYSTEM = `You are a senior Business Analyst with 15+ years in Banking & Financial Services (UK and India): regulatory reporting, consumer credit, credit reference agency reporting, collections & recoveries, data warehousing (Teradata/SQL) and UAT.
You turn raw inputs (messy meeting notes, emails, dictation, or business requirement documents) into client-ready project documentation.
Rules:
- Write in clear, professional, client-ready British English. Concise, no filler.
- Output GitHub-flavoured Markdown only. Use '##' and '###' for headings (never '#').
- Use Markdown tables for structured data. Use \`\`\`sql and \`\`\`gherkin code fences for code.
- Never invent hard facts (system names, table names, dates, figures, regulation clauses). If something is not in the input, state it as an assumption marked **[Assumption]** or list it under open questions.
- Use stable IDs so documents cross-reference: REQ-01, US-01, DM-01, TC-01, BR-01, DQ-01, RISK-01.
- Do not add any preamble such as "Here is..."; start directly with the content.`;

/* ====================================================================== state */
const VIEWS = [["input","Input"],["sections","Sections"],["diagrams","Diagrams"],["export","Review & Export"]];
const blankMeta = () => ({project_name:"", client:"", author:"", version:"0.1", doc_title:"Business Requirements & High-Level Design", domain:"", system_context:""});
function newProject() {
  const o = {}; SECTIONS.forEach(s => o[s.id] = "");
  return { id: "p" + Date.now().toString(36), meta: blankMeta(), notes: "", file_text: "", file_names: [],
    sections: {...o}, saved: {...o}, approved: Object.fromEntries(SECTIONS.map(s => [s.id, false])),
    diagrams: [], updated_at: "" };
}
let P = newProject();
let history = {};               // per-section undo stack (session only)
let view = "input", cur = "analysis", tab = "edit";

/* ====================================================================== helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg, kind = "info", ms = 5000, action, fn) {
  const d = document.createElement("div"); d.className = "notice " + kind; d.setAttribute("role", "status");
  const sp = document.createElement("span"); sp.textContent = msg; d.appendChild(sp);
  if (action && fn) { const b = document.createElement("button"); b.type = "button"; b.textContent = action; b.onclick = () => { d.remove(); fn(); }; d.appendChild(b); }
  $("#toast").appendChild(d); setTimeout(() => d.remove(), ms);
}
function status(id) {
  const t = (P.sections[id] || "").trim();
  if (!t) return ["Not started", "none"];
  if (P.approved[id]) return ["Approved", "ok"];
  if (P.sections[id] === P.saved[id]) return ["Saved", "saved"];
  return ["Draft - not saved", "draft"];
}
const isSaved = id => ["saved", "ok"].includes(status(id)[1]);
const savedCount = () => SECTIONS.filter(s => isSaved(s.id)).length;
const allSaved = () => savedCount() === SECTIONS.length;
const combinedInput = () => [P.notes.trim(), P.file_text.trim()].filter(Boolean).join("\n\n");
const stripFences = t => { const m = t.trim().match(/^```[a-zA-Z]*\s*\n([\s\S]*)\n```\s*$/); return m ? m[1].trim() : t.trim(); };
const slug = s => (s || "ba_document").replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_|_$/g, "") || "ba_document";

function ctxBlock() {
  const m = P.meta, L = [`Project: ${m.project_name || "Untitled"}`];
  if (m.client) L.push(`Client / Business unit: ${m.client}`);
  if (m.domain) L.push(`Domain / regulatory context: ${m.domain}`);
  if (m.system_context) L.push(`Known systems, tables and current process details:\n${m.system_context}`);
  L.push(`=== RAW INPUT (notes / BRD / dictation) ===\n${combinedInput()}`);
  return L.join("\n");
}
function sectionPrompt(id) {
  const s = SEC[id], parts = [SYSTEM, ctxBlock()];
  s.deps.forEach(d => { if (P.sections[d].trim()) parts.push(`=== EXISTING SECTION: ${SEC[d].title} ===\n${P.sections[d]}`); });
  parts.push(`=== YOUR TASK ===\nWrite the section '${s.title}'.\n${s.ins}`);
  return parts.join("\n\n");
}

async function ask(prompt, onText) {
  if (!sample) throw {message: "The AI engine is not available in this view. Open the page on claude.ai while signed in."};
  abortCtl = new AbortController();
  const r = await sample(prompt, {modelTier: "default", cache: false, signal: abortCtl.signal,
    onText: onText ? (({text}) => onText(text)) : undefined});
  return stripFences(r.text || "");
}
function aiError(e) {
  if (e && e.code === "rate_limited") return "The AI is busy right now. Wait a minute and try again.";
  if (e && e.code === "not_granted") return "Permission to use Claude was not granted. Reload the page and allow it.";
  if (e && e.name === "AbortError") return "Stopped.";
  return (e && e.message) || "Something went wrong talking to the AI.";
}
function setSection(id, text) {
  if (P.sections[id].trim() && P.sections[id] !== text) (history[id] = history[id] || []).push(P.sections[id]);
  if (history[id] && history[id].length > 10) history[id].shift();
  P.sections[id] = text;
}

/* ====================================================================== persistence */
let saveTimer = null;
async function persist() {
  P.updated_at = new Date().toISOString();
  const body = JSON.parse(JSON.stringify(P));
  try { localStorage.setItem("bacopilot:last", JSON.stringify(body)); } catch (_) {}
  if (db && uid) {
    try { await db.collection("data/users/" + uid).doc(P.id).set(body);
      $("#saveState").textContent = "Saved to your projects · " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    } catch (e) { $("#saveState").textContent = "Saved in this browser only"; }
  } else {
    $("#saveState").textContent = "Saved in this browser";
  }
}
function persistSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 1200); }

async function listProjects() {
  if (db && uid) {
    try { const q = await db.collection("data/users/" + uid).orderBy("updated_at", "desc").limit(50).get();
      return q.docs.map(d => d.data()); } catch (_) {}
  }
  try { const l = JSON.parse(localStorage.getItem("bacopilot:last")); return l ? [l] : []; } catch (_) { return []; }
}
function loadProject(data) {
  const base = newProject();
  P = {...base, ...data, meta: {...base.meta, ...(data.meta || {})}, sections: {...base.sections, ...(data.sections || {})},
       saved: {...base.saved, ...(data.saved || {})}, approved: {...base.approved, ...(data.approved || {})},
       diagrams: data.diagrams || [], file_names: data.file_names || []};
  history = {}; pendingFiles = [];
  render();
}

/* ====================================================================== render: shell */
function renderRail() {
  $("#rail").innerHTML = VIEWS.map(([v, l], i) => (i ? '<span class="sep" aria-hidden="true"></span>' : "") + (() => {
    const done = (v === "input" && SECTIONS.some(s => P.sections[s.id].trim())) || (v === "sections" && allSaved()) ||
                 (v === "diagrams" && P.diagrams.length > 0);
    return `<button type="button" data-v="${v}" aria-current="${view === v}" class="${done && view !== v ? "done" : ""}"><span class="n">${done && view !== v ? "✓" : i + 1}</span>${l}</button>`;
  })()).join("");
  $("#rail").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.v));
}
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function render() {
  renderRail();
  ({input: renderInput, sections: renderSections, diagrams: renderDiagrams, export: renderExport})[view]();
}

function field(k, label, ph, req) {
  return `<label class="f" for="f_${k}">${label}${req ? " *" : ""}<input type="text" id="f_${k}" value="${esc(P.meta[k])}" placeholder="${esc(ph)}"></label>`;
}
function addFiles(files) {
  files.filter(f => /\.(docx|pdf|txt|md)$/i.test(f.name)).forEach(f => { if (!pendingFiles.some(p => p.name === f.name)) pendingFiles.push(f); });
  renderChips();
}
function renderChips() {
  const names = [...pendingFiles.map(f => f.name), ...P.file_names.filter(n => !pendingFiles.some(f => f.name === n)).map(n => n + " (read)")];
  $("#fileChips").innerHTML = names.map((n, i) => `<span class="chip">${esc(n)}<button type="button" aria-label="Remove ${esc(n)}" data-i="${i}">✕</button></span>`).join("");
  $("#fileChips").querySelectorAll("button").forEach(b => b.onclick = ev => {
    ev.stopPropagation(); const i = +b.dataset.i;
    if (i < pendingFiles.length) pendingFiles.splice(i, 1); else { P.file_names = []; P.file_text = ""; }
    renderChips();
  });
}
function startDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const help = $("#dictHelp");
  const fallback = msg => { help.className = "notice warn"; help.innerHTML = (msg ? esc(msg) + " " : "") +
    "Click into the notes box and press <kbd>Win</kbd> + <kbd>H</kbd> (Windows) or <kbd>Fn</kbd> twice (Mac) to dictate with your computer's voice typing."; $("#notes").focus(); };
  if (!SR) return fallback("This browser can't record here.");
  try {
    const rec = new SR(); rec.lang = "en-IN"; rec.continuous = true; rec.interimResults = false;
    const btn = $("#dictBtn"); btn.textContent = "● Listening... click to stop"; btn.classList.add("rec");
    rec.onresult = e => { let t = ""; for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript + " ";
      P.notes = (P.notes.trimEnd() + "\n" + t.trim()).trim(); $("#notes").value = P.notes; persistSoon(); };
    rec.onerror = () => { btn.textContent = "🎙 Dictate into notes"; fallback("The microphone is blocked inside this page."); };
    rec.onend = () => { btn.textContent = "🎙 Dictate into notes"; btn.classList.remove("rec"); btn.onclick = startDictation; };
    btn.onclick = () => rec.stop();
    rec.start();
  } catch (_) { fallback("The microphone is blocked inside this page."); }
}
function resetInputs() {
  P.meta = blankMeta(); P.notes = ""; P.file_text = ""; P.file_names = []; pendingFiles = []; delete P._sample;
  persistSoon(); renderInput(); toast("Inputs cleared. Your generated sections are kept until you submit new input.");
}
async function readFile(f) {
  const name = f.name.toLowerCase();
  if (name.endsWith(".docx")) { const r = await mammoth.extractRawText({arrayBuffer: await f.arrayBuffer()}); return r.value; }
  if (name.endsWith(".pdf")) {
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise; let out = [];
    for (let i = 1; i <= pdf.numPages; i++) { const pg = await pdf.getPage(i); const c = await pg.getTextContent(); out.push(c.items.map(x => x.str).join(" ")); }
    return out.join("\n");
  }
  return await f.text();
}
async function submit() {
  const errs = [], err = $("#inErr");
  if (!P.meta.project_name.trim()) errs.push("Enter a project name.");
  if (pendingFiles.length) {
    const texts = [], names = [];
    for (const f of pendingFiles) {
      try { texts.push(`--- Document: ${f.name} ---\n${await readFile(f)}`); names.push(f.name); }
      catch (e) { errs.push(`Could not read ${f.name}. Save it as .docx, .pdf or .txt and try again.`); }
    }
    if (names.length) { P.file_text = texts.join("\n\n"); P.file_names = names; pendingFiles = []; }
  }
  if (!combinedInput()) errs.push("Add some input: upload a document, paste notes or dictate.");
  const rep = $("#replaceOk"); if (rep && !rep.checked) errs.push("Tick the box to confirm you want to replace the existing sections.");
  if (errs.length) { err.innerHTML = errs.map(e => `<div class="notice bad">${esc(e)}</div>`).join(""); return; }
  err.innerHTML = "";
  const ok = await runGeneration(SECTIONS.map(s => s.id));
  delete P._sample; await persist();
  if (ok) { cur = "analysis"; mode = "edit"; go("sections"); toast("All sections drafted. Review each one, edit as needed and click Save.", "ok", 7000); }
  else render();
}

async function runGeneration(ids) {
  if (busy) return false; busy = true;
  const ov = document.createElement("div"); ov.className = "overlay";

}
function traceRows() {
  const t = parseMd(P.sections.traceability || "").find(b => b.type === "table" && /REQ/i.test(b.rows[0][0]));

  return t.rows.slice(1).map(r => {

}

function diffHtml(a, b) {
  const A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length;
  if (n * m > 400000) return `<div class="notice info">This section is too long to compare line by line.</div>`;
  const L = Array.from({length: n + 1}, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push(["same", A[i]]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push(["del", A[i++]]); else out.push(["add", B[j++]]);
  }
  while (i < n) out.push(["del", A[i++]]); while (j < m) out.push(["add", B[j++]]);
  const changed = out.filter(x => x[0] !== "same").length;
  return `<div class="hint">${changed} line${changed === 1 ? "" : "s"} changed</div><div class="diff">${out.map(([k, t]) => `<div class="${k}">${k === "add" ? "+ " : k === "del" ? "− " : "  "}${esc(t) || " "}</div>`).join("")}</div>`;
}

/* ---------- markdown → blocks (shared by Word and PDF) */
function parseMd(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n"), B = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i], s = line.trim();
    if (!s) { i++; continue; }
    if (s.startsWith("```")) { const lang = s.slice(3).trim(), code = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) code.push(lines[i++]);
      B.push({type: "code", lang, text: code.join("\n")}); i++; continue; }
    let m = s.match(/^(#{1,6})\s+(.*)/);
    if (m) { B.push({type: "heading", level: m[1].length, text: m[2].replace(/\*\*/g, "")}); i++; continue; }
    if (s.startsWith("|")) { const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        const cells = lines[i].trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim());
        if (!cells.every(c => !c || /^:?-{2,}:?$/.test(c))) rows.push(cells); i++; }
      if (rows.length) { const w = Math.max(...rows.map(r => r.length)); rows.forEach(r => { while (r.length < w) r.push(""); }); B.push({type: "table", rows}); }
      continue; }
    m = line.match(/^(\s*)[-*+]\s+(.*)/);
    if (m) { B.push({type: "bullet", level: Math.min(1, Math.floor(m[1].length / 2)), text: m[2]}); i++; continue; }
    m = line.match(/^(\s*)(\d+)[.)]\s+(.*)/);
    if (m) { B.push({type: "number", level: 0, text: m[3]}); i++; continue; }
    B.push({type: "para", text: s}); i++;
  }
  return B;
}
function runs(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*\s][^*]*\*)/).filter(Boolean).map(p => {
    if (/^\*\*.+\*\*$/.test(p)) return {t: p.slice(2, -2), b: true};
    if (/^`.+`$/.test(p)) return {t: p.slice(1, -1), code: true};
    if (/^\*.+\*$/.test(p) && p.length > 2) return {t: p.slice(1, -1), i: true};
    return {t: p};
  });
}
function colWidths(rows, total, charW, pad) {
  const n = rows[0].length, minW = [], weight = [];
  for (let c = 0; c < n; c++) {
    const words = rows.flatMap(r => (r[c] || "").replace(/\*\*/g, "").split(/\s+/)).filter(Boolean);
    const longest = Math.max(3, ...words.map(w => w.length));
    minW.push(Math.min(longest, 18) * charW + pad);
    weight.push(Math.min(Math.max(...rows.map(r => (r[c] || "").length)), 80) + 1);
  }
  const base = minW.reduce((a, b) => a + b, 0);
  if (base >= total) return minW.map(m => total * m / base);
  const extra = total - base, tot = weight.reduce((a, b) => a + b, 0);
  return minW.map((m, k) => m + extra * weight[k] / tot);
}
function docSections() {
  const out = []; let n = 0;
  const inc = P.diagrams.filter(d => d.include && d.code.trim());
  SECTIONS.forEach(s => { if (!P.sections[s.id].trim()) return; n++;
    out.push({title: `${n}. ${s.title}`, content: P.sections[s.id], diagrams: inc.filter(d => d.attach === s.id)}); });
  const app = inc.filter(d => !SECTIONS.some(s => s.id === d.attach && P.sections[s.id].trim()));
  if (app.length) out.push({title: "Appendix A. Diagrams", content: "", diagrams: app});
  return out;
}
const docStatus = () => SECTIONS.every(s => P.approved[s.id]) ? "Final - all sections approved" : "Final - all sections reviewed";
const today = () => new Date().toLocaleDateString("en-GB", {day: "2-digit", month: "long", year: "numeric"});
const todayShort = () => new Date().toLocaleDateString("en-GB");

async function svgToPng(svgText) {
  const doc = new DOMParser().parseFromString(svgText, "image/svg+xml"), svg = doc.documentElement;
  const vb = (svg.getAttribute("viewBox") || "0 0 800 600").split(/[\s,]+/).map(Number);
  const w = vb[2] || 800, h = vb[3] || 600, scale = 2;
  svg.setAttribute("width", w); svg.setAttribute("height", h); svg.removeAttribute("style");
  svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
  const img = new Image(); await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = src; });
  const c = document.createElement("canvas"); c.width = Math.ceil(w * scale); c.height = Math.ceil(h * scale);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return {dataUrl: c.toDataURL("image/png"), w, h};
}
async function diagramImages(secs) {
  const warn = [];
  for (const s of secs) for (const d of s.diagrams) {
    const r = await mermaidSvg(d.code);
    if (!r.svg) { warn.push(d.title); d._img = null; continue; }
    try { d._img = await svgToPng(r.svg); } catch (_) { d._img = null; warn.push(d.title); }
  }
  return warn;
}

async function doExport(kind) {

  const secs = docSections().map(s => ({...s, diagrams: s.diagrams.map(d => ({...d}))}));
  try {
    const warn = await diagramImages(secs);
    const blob = kind === "docx" ? await buildDocx(secs) : await buildPdf(secs);
    const filename = `${slug(P.meta.project_name)}_HLD.${kind}`;
    msg.textContent = warn.length ? `Some diagrams have syntax errors and were included as code: ${warn.join(", ")}.` : "";
    if (!downloads) { msg.textContent = "Downloads aren't available in this view. Open the page on claude.ai."; return; }
    await downloads.save({filename, data: blob});
    toast(`${filename} downloaded.`, "ok");

    if (e && e.code === "declined") { msg.textContent = "Download cancelled."; return; }
    console.error(e); msg.textContent = "Couldn't build the file: " + ((e && e.message) || e);
  }
}

async function buildDocx(secs) {

      rows: rows.map((r, ri) => new D.TableRow({tableHeader: ri === 0, children: r.map((c, ci) => new D.TableCell({
        width: {size: widths[ci], type: D.WidthType.DXA}, borders,

        margins: {top: 40, bottom: 40, left: 80, right: 80},
        children: [new D.Paragraph({children: runs(c).map(x => tr(x, size, ri === 0 ? {bold: true, color: "FFFFFF"} : {}))})]}))}))});
  };
  const codeBox = text => new D.Table({width: {size: FULL, type: D.WidthType.DXA}, columnWidths: [FULL],
    rows: [new D.TableRow({children: [new D.TableCell({width: {size: FULL, type: D.WidthType.DXA}, borders, shading: cellShade("F3F4F6"),
      margins: {top: 80, bottom: 80, left: 120, right: 120},
      children: text.split("\n").map(l => new D.Paragraph({spacing: {after: 0}, children: [new D.TextRun({text: l || " ", font: "Consolas", size: 16})]}))})]})]});
  const kv = (k, v) => new D.Paragraph({spacing: {after: 80}, children: [new D.TextRun({text: k + ": ", bold: true}), new D.TextRun(v)]});

  const children = [];
  // cover
  for (let i = 0; i < 6; i++) children.push(new D.Paragraph(""));
  children.push(new D.Paragraph({children: [new D.TextRun({text: m.project_name || "Untitled Project", bold: true, size: 56, color: NAVY})]}));
  children.push(new D.Paragraph({spacing: {after: 400}, children: [new D.TextRun({text: m.doc_title || "Business Requirements & High-Level Design", size: 32, color: "4B5563"})]}));
  [["Client / Business unit", m.client], ["Prepared by", m.author], ["Version", m.version || "0.1"], ["Date", today()], ["Status", docStatus()]]
    .filter(x => x[1]).forEach(([k, v]) => children.push(kv(k, v)));
  children.push(new D.Paragraph({children: [new D.PageBreak()]}));
  // document control
  children.push(new D.Paragraph({heading: D.HeadingLevel.HEADING_1, text: "Document Control"}));
  children.push(table([["Version", "Date", "Author", "Status", "Change Description"], [m.version || "0.1", todayShort(), m.author || "", docStatus(), "Drafted with BA Copilot; reviewed and saved by author"]]));
  children.push(new D.Paragraph({heading: D.HeadingLevel.HEADING_2, text: "Section Review Status", spacing: {before: 300}}));
  children.push(table([["Section", "Status"], ...SECTIONS.map(s => [s.title, status(s.id)[0]])]));
  children.push(new D.Paragraph({children: [new D.PageBreak()]}));
  children.push(new D.Paragraph({heading: D.HeadingLevel.HEADING_1, text: "Contents"}));
  children.push(new D.TableOfContents("Contents", {hyperlink: true, headingStyleRange: "1-2"}));

  secs.forEach(s => {
    children.push(new D.Paragraph({children: [new D.PageBreak()]}));
    children.push(new D.Paragraph({heading: D.HeadingLevel.HEADING_1, text: s.title}));

    parseMd(s.content).forEach(b => {

    features: {updateFields: true},

      heading2: {run: {font: "Calibri", size: 26, bold: true, color: BLUE}, paragraph: {spacing: {before: 240, after: 100}}},
      heading3: {run: {font: "Calibri", size: 23, bold: true, color: NAVY}, paragraph: {spacing: {before: 180, after: 80}}}}},
    numbering: {config: [
      {reference: "bul", levels: [lvl(0, D.LevelFormat.BULLET, "•", 360), lvl(1, D.LevelFormat.BULLET, "–", 720)]},
      {reference: "num", levels: [lvl(0, D.LevelFormat.DECIMAL, "%1.", 360)]}]},
    sections: [{

      headers: {first: new D.Header({children: []}), default: new D.Header({children: [new D.Paragraph({children: [new D.TextRun({text: `${m.project_name || ""}  |  ${m.client || ""}`, size: 16, color: "6B7280"})]})]})},
      footers: {first: new D.Footer({children: []}), default: new D.Footer({children: [new D.Paragraph({alignment: D.AlignmentType.RIGHT, children: [new D.TextRun({children: ["Page ", D.PageNumber.CURRENT], size: 16, color: "6B7280"})]})]})},

}

/* ---------- PDF */
async function buildPdf(secs) {
  const m = P.meta, NAVY = "#0B1B33", BLUE = "#0B5CAD", AVAIL = 515;

      layout: {hLineColor: "#CBD5E1", vLineColor: "#CBD5E1", hLineWidth: () => 0.5, vLineWidth: () => 0.5, paddingLeft: () => 4, paddingRight: () => 4, paddingTop: () => 2.5, paddingBottom: () => 2.5}};
  };

    layout: {hLineColor: "#E5E7EB", vLineColor: "#E5E7EB", paddingLeft: () => 8, paddingRight: () => 8, paddingTop: () => 6, paddingBottom: () => 6}});
  const content = [];
  // cover
  content.push({canvas: [{type: "rect", x: 0, y: 0, w: 360, h: 5, color: BLUE}, {type: "rect", x: 360, y: 0, w: 155, h: 5, color: "#9CC3E6"}], margin: [0, 190, 0, 14]});
  content.push({text: m.project_name || "Untitled Project", style: "title", margin: [0, 0, 0, 6]});
  content.push({text: m.doc_title || "Business Requirements & High-Level Design", fontSize: 15, color: "#4B5563", margin: [0, 0, 0, 30]});
  [["Client / Business unit", m.client], ["Prepared by", m.author], ["Version", m.version || "0.1"], ["Date", today()], ["Status", docStatus()]]
    .filter(x => x[1]).forEach(([k, v]) => content.push({text: [{text: k + ": ", bold: true}, v], margin: [0, 0, 0, 4]}));
  content.push({text: "Document Control", style: "h1", pageBreak: "before"});
  content.push(table([["Version", "Date", "Author", "Status", "Change Description"], [m.version || "0.1", todayShort(), m.author || "", docStatus(), "Drafted with BA Copilot; reviewed and saved by author"]]));
  content.push({text: "Section Review Status", style: "h2"});
  content.push(table([["Section", "Status"], ...SECTIONS.map(s => [s.title, status(s.id)[0]])]));
  content.push({toc: {title: {text: "Contents", style: "h1"}, numberStyle: {fontSize: 9.5}, textStyle: {fontSize: 9.5}}, pageBreak: "before"});
  let fig = 0;
  secs.forEach(s => {
    content.push({text: s.title, style: "h1", tocItem: true, tocStyle: {bold: true}, tocMargin: [0, 6, 0, 0], pageBreak: "before"});
    const blocks = parseMd(s.content); let k = 0;
    while (k < blocks.length) {
      const b = blocks[k];
      if (b.type === "bullet" || b.type === "number") {
        const items = []; const t = b.type;

      }
      if (b.type === "heading") content.push({text: b.text, style: b.level <= 2 ? "h2" : "h3", tocItem: b.level <= 2, tocMargin: [14, 0, 0, 0]});
      else if (b.type === "para") content.push(txt(b.text, {margin: [0, 0, 0, 5]}));
      else if (b.type === "code") content.push(code(b.text));

      k++;

        let w = Math.min(AVAIL, d._img.w < 300 ? d._img.w * 1.3 : AVAIL), h = d._img.h * w / d._img.w;
        if (h > 640) { w = w * 640 / h; h = 640; }
        content.push({stack: [{image: d._img.dataUrl, width: w, alignment: "center", margin: [0, 8, 0, 4]},
          {text: `Figure ${fig}: ${d.title}`, italics: true, fontSize: 8.5, color: "#4B5563", alignment: "center", margin: [0, 0, 0, 10]}], unbreakable: true});
      } else { content.push(code(d.code)); content.push({text: `Figure ${fig}: ${d.title} (Mermaid source)`, italics: true, fontSize: 8.5, alignment: "center"}); }
    });
  });
  const dd = {
    pageSize: "A4", pageMargins: [40, 50, 40, 46], content,
    info: {title: m.project_name || "Project Document", author: m.author || ""},
    defaultStyle: {fontSize: 9.5, lineHeight: 1.25, color: "#111827"},
    styles: {title: {fontSize: 26, bold: true, color: NAVY}, h1: {fontSize: 16, bold: true, color: BLUE, margin: [0, 0, 0, 10]},
      h2: {fontSize: 12.5, bold: true, color: BLUE, margin: [0, 10, 0, 5]}, h3: {fontSize: 10.5, bold: true, color: NAVY, margin: [0, 8, 0, 4]}},
    header: (p) => p === 1 ? null : {text: `${m.project_name || ""}  |  ${m.client || ""}`, fontSize: 7.5, color: "#6B7280", margin: [40, 22, 40, 0]},
    footer: (p) => p === 1 ? null : {text: `Page ${p}`, alignment: "right", fontSize: 7.5, color: "#6B7280", margin: [40, 14, 40, 0]},
  };
  return await new Promise((res, rej) => { try { pdfMake.createPdf(dd).getBlob(res); } catch (e) { rej(e); } });
}

/* ====================================================================== projects dialog */
async function openProjects() {
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="box" role="dialog" aria-label="Projects"><div class="row"><h2 class="grow">Projects</h2><button class="btn ghost" type="button" data-x>Close</button></div>
    <p class="lede" style="margin:0">${db && uid ? "Your projects are saved to your account automatically and are private to you." : "Projects are saved in this browser."}</p>
    <div id="plist" class="steps">Loading...</div>
    <div class="row"><button class="btn primary" type="button" data-new>Start a new project</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector("[data-x]").onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.querySelector("[data-new]").onclick = async () => { await persist(); P = newProject(); history = {}; pendingFiles = []; ov.remove(); view = "input"; render(); persist(); };
  const list = await listProjects();
  ov.querySelector("#plist").innerHTML = list.length ? list.map((p, i) => `<div class="row" style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink)">
      <span class="grow"><b>${esc(p.meta?.project_name || "Untitled")}</b><br><span style="color:var(--muted);font-size:12.5px">${p.updated_at ? new Date(p.updated_at).toLocaleString() : ""} · ${SECTIONS.filter(s => (p.saved || {})[s.id] && (p.saved || {})[s.id] === (p.sections || {})[s.id]).length}/8 saved</span></span>
      <button class="btn" type="button" data-open="${i}" ${p.id === P.id ? "disabled" : ""}>${p.id === P.id ? "Open now" : "Open"}</button></div>`).join("") : "No saved projects yet.";
  ov.querySelectorAll("[data-open]").forEach(b => b.onclick = async () => { await persist(); loadProject(list[+b.dataset.open]); ov.remove(); go(SECTIONS.some(s => P.sections[s.id].trim()) ? "sections" : "input"); });
}

/* ====================================================================== boot */
$("#projBtn").onclick = openProjects;
try { const th = localStorage.getItem("bacopilot:theme"); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("bacopilot:theme", document.documentElement.dataset.theme); } catch (_) {}
};
$("#kbdBtn").onclick = () => {
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="box" role="dialog" aria-label="Keyboard shortcuts"><div class="row"><h2 class="grow">Keyboard shortcuts</h2><button class="btn ghost" type="button" data-x>Close</button></div>
    <table class="status"><tbody>
      <tr><td><kbd>Ctrl</kbd> + <kbd>Enter</kbd></td><td>Submit your input to the AI (Input step)</td></tr>
      <tr><td><kbd>Ctrl</kbd> + <kbd>S</kbd></td><td>Save the current section</td></tr>
      <tr><td><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd></td><td>Save and go to the next unsaved section</td></tr>
      <tr><td><kbd>Alt</kbd> + <kbd>↓</kbd> / <kbd>↑</kbd></td><td>Next / previous section</td></tr>
      <tr><td><kbd>Alt</kbd> + <kbd>1</kbd>…<kbd>4</kbd></td><td>Jump to a step</td></tr>
      <tr><td><kbd>Win</kbd> + <kbd>H</kbd></td><td>Windows voice typing into any text box</td></tr>
    </tbody></table></div>`;
  document.body.appendChild(ov); ov.querySelector("[data-x]").onclick = () => ov.remove(); ov.onclick = e => { if (e.target === ov) ov.remove(); };
};
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === "Enter" && view === "input") { e.preventDefault(); $("#submitBtn").click(); }
  else if (mod && (e.key === "s" || e.key === "S") && view === "sections") { e.preventDefault(); saveSection(e.shiftKey); }
  else if (e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp") && view === "sections") {
    e.preventDefault(); const i = SECTIONS.findIndex(s => s.id === cur) + (e.key === "ArrowDown" ? 1 : -1);
    if (i >= 0 && i < SECTIONS.length) { cur = SECTIONS[i].id; renderSections(); } }
  else if (e.altKey && /^[1-4]$/.test(e.key)) { e.preventDefault(); go(VIEWS[+e.key - 1][0]); }
});
// Open in a realistic working state: last project if any, else the example input.
try { const last = JSON.parse(localStorage.getItem("bacopilot:last")); if (last && last.meta) loadProject(last); } catch (_) {}
if (!P.meta.project_name && !P.notes) { P.meta = {...SAMPLE.meta}; P.notes = SAMPLE.notes; P._sample = true; }
render();

(async () => {
  if (!window.claude || !window.claude.use) { toast("Open this page on claude.ai to use the AI, saving and downloads.", "warn", 9000); return; }
  const [s, d, dbx, u] = await Promise.all(["sample", "downloads", "db", "user"].map(n => window.claude.use(n).catch(() => null)));
  sample = s; downloads = d; db = dbx;
  if (u) { try { uid = await u.id(); } catch (_) {} }
  if (!sample) toast("The AI engine isn't available in this view. Open the page on claude.ai while signed in.", "warn", 9000);
  if (db && uid) {
    try { const list = await listProjects();
      if (list.length && (P._sample || !P.updated_at || (list[0].updated_at > P.updated_at))) { loadProject(list[0]); }
      $("#saveState").textContent = "Saved to your projects";
    } catch (_) {}
  }
})();
</script>
</body>
</html>
